<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spooky Night</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>🎃 Spooky Night 🎃</h1>
    <p class="tagline">A little corner of the web for Halloween lovers.</p>
  </header>

  <main>
    <section id="countdown">
      <h2>Countdown to Halloween</h2>
      <p id="countdown-timer" aria-live="polite" aria-atomic="true">Loading...</p>
    </section>

    <section id="about">
      <h2>About This Site</h2>
      <p>
        Welcome! This is a small starter site for celebrating Halloween.
        Add your own spooky stories, party plans, or costume ideas here.
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Spooky Night. Made with 🖤 for Halloween.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
